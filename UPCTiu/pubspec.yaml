name: upctiu
description: "tiu"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  shared_preferences: ^2.2.2  # <-- NUEVO
  path_provider: ^2.1.2       # <-- NUEVO
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Fuentes declaradas aquí: el motor las registra al arrancar y el primer frame
  # ya sale con la letra correcta (sin cargas asíncronas ni cambio de fuente).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
  uses-material-design: true
  assets:
    - assets/cloud.png
    - assets/arbolito.png
